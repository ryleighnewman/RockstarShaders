<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">
  <title>Figure 1. Frame graph</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#111" stroke-width="1.3"/>
    </marker>
    <style>
      text{font-size:12px;fill:#111;font-family:Helvetica,Arial,sans-serif}
      .b{fill:#fff;stroke:#111;stroke-width:1.2}
      .k{fill:#fff;stroke:#111;stroke-width:1.2;stroke-dasharray:4 3}
      .c{text-anchor:middle}
      .e{text-anchor:end}
      .t{text-anchor:middle;font-weight:700}
      .l{stroke:#111;stroke-width:1.2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#fff"/>
  <text class="t" x="600" y="30">Figure 1. Frame graph</text>

  <rect x="140" y="58" width="1040" height="124" fill="#f3f5f8"/>
  <rect x="140" y="252" width="1040" height="140" fill="#f3f5f8"/>
  <text x="150" y="76">Vulkan, through MoltenVK (Minecraft's renderer)</text>
  <text x="150" y="270">Metal (libvrt.dylib, vrt.metallib)</text>

  <rect class="b" x="16" y="88" width="108" height="272"/>
  <text class="t" x="70" y="214">Minecraft 26.3</text>
  <text class="c" x="70" y="234">chunk sections,</text>
  <text class="c" x="70" y="250">entities, camera</text>

  <g>
    <rect class="b" x="148" y="88" width="136" height="78"/><text class="t" x="216" y="112">Shadow maps</text><text class="c" x="216" y="132">4 cascades, PCSS,</text><text class="c" x="216" y="148">far-field height map</text>
    <rect class="b" x="296" y="88" width="136" height="78"/><text class="t" x="364" y="112">G-buffer</text><text class="c" x="364" y="132">terrain, entities,</text><text class="c" x="364" y="148">far-field terrain</text>
    <rect class="b" x="444" y="88" width="136" height="78"/><text class="t" x="512" y="112">Screen space</text><text class="c" x="512" y="132">SSAO, contact</text><text class="c" x="512" y="148">shadows, SSR</text>
    <rect class="b" x="592" y="88" width="136" height="78" stroke-width="2"/><text class="t" x="660" y="112">Lighting</text><text class="c" x="660" y="132">deferred PBR: sun,</text><text class="c" x="660" y="148">sky, block light</text>
    <rect class="b" x="740" y="88" width="136" height="78"/><text class="t" x="808" y="112">Atmosphere</text><text class="c" x="808" y="132">sky, clouds, fog,</text><text class="c" x="808" y="148">light shafts</text>
    <rect class="b" x="888" y="88" width="136" height="78"/><text class="t" x="956" y="112">Water</text><text class="c" x="956" y="132">ripple simulation,</text><text class="c" x="956" y="148">caustics, reflections</text>
    <rect class="b" x="1036" y="88" width="136" height="78"/><text class="t" x="1104" y="112">Post</text><text class="c" x="1104" y="132">TAA, exposure,</text><text class="c" x="1104" y="148">bloom, AgX</text>
  </g>
  <g class="l" marker-end="url(#a)">
    <line x1="124" y1="127" x2="146" y2="127"/>
    <line x1="284" y1="127" x2="294" y2="127"/><line x1="432" y1="127" x2="442" y2="127"/>
    <line x1="580" y1="127" x2="590" y2="127"/><line x1="728" y1="127" x2="738" y2="127"/>
    <line x1="876" y1="127" x2="886" y2="127"/><line x1="1024" y1="127" x2="1034" y2="127"/>
    <line x1="1104" y1="88" x2="1104" y2="44"/>
  </g>
  <text x="1112" y="54">display</text>

  <g>
    <rect class="b" x="148" y="282" width="136" height="78"/><text class="t" x="216" y="306">BLAS</text><text class="c" x="216" y="326">per chunk section,</text><text class="c" x="216" y="342">compacted</text>
    <rect class="b" x="296" y="282" width="136" height="78"/><text class="t" x="364" y="306">TLAS</text><text class="c" x="364" y="326">sections, player and</text><text class="c" x="364" y="342">entities, every frame</text>
    <rect class="k" x="444" y="282" width="136" height="78"/><text class="t" x="512" y="306">Cutout test</text><text class="c" x="512" y="326">intersection function,</text><text class="c" x="512" y="342">alpha-tested blocks</text>
    <rect class="b" x="592" y="282" width="136" height="78" stroke-width="2"/><text class="t" x="660" y="306">vrt_shadow_kernel</text><text class="c" x="660" y="326">sun shadow, sky</text><text class="c" x="660" y="342">visibility, bounce</text>
    <rect class="b" x="740" y="282" width="136" height="78"/><text class="t" x="808" y="306">vrt_fog_kernel</text><text class="c" x="808" y="326">sun and sky visibility</text><text class="c" x="808" y="342">in the fog volume</text>
    <rect class="b" x="888" y="282" width="136" height="78"/><text class="t" x="956" y="306">vrt_reflect_kernel</text><text class="c" x="956" y="326">water reflections,</text><text class="c" x="956" y="342">player and entities</text>
    <rect class="k" x="1036" y="282" width="136" height="78"/><text class="t" x="1104" y="306">MetalFX</text><text class="c" x="1104" y="326">temporal upscaling</text><text class="c" x="1104" y="342">(experimental)</text>
  </g>
  <g class="l" marker-end="url(#a)">
    <line x1="124" y1="321" x2="146" y2="321"/>
    <line x1="284" y1="321" x2="294" y2="321"/>
    <polyline points="364,360 364,378 660,378 660,362"/>
    <polyline points="660,378 808,378 808,362"/>
    <polyline points="808,378 956,378 956,362"/>
    <line x1="660" y1="282" x2="660" y2="168"/>
    <line x1="808" y1="282" x2="808" y2="168"/>
    <line x1="940" y1="166" x2="940" y2="280"/>
    <line x1="972" y1="282" x2="972" y2="168"/>
  </g>
  <line class="l" x1="512" y1="360" x2="512" y2="378" stroke-dasharray="4 3"/>
  <line class="l" x1="1104" y1="282" x2="1104" y2="168" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="370" y="374">rays</text>
  <text x="518" y="374">any-hit</text>
  <text x="666" y="206">shadow, sky and</text><text x="666" y="222">bounce light,</text><text x="666" y="238">denoised</text>
  <text x="814" y="222">fog visibility</text>
  <text class="e" x="934" y="238">ray requests</text>
  <text x="978" y="222">hits</text>

  <text class="c" x="600" y="418">Intersection: M3 and later use the GPU's ray tracing hardware; M1 and M2 run the same kernels with software traversal.</text>
  <text class="c" x="600" y="436">Vulkan and Metal share the frame's textures and buffers directly and synchronize on a shared timeline semaphore.</text>
  <text class="c" x="600" y="466"><tspan font-weight="700">Figure 1.</tspan> One frame. Minecraft's chunk sections feed both the Vulkan rasterizer and a Metal acceleration structure;</text>
  <text class="c" x="600" y="484">three ray tracing kernels feed the lighting, atmosphere and water passes.</text>
</svg>
